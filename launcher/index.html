<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TizPSX</title>
<style>html,body{margin:0;width:100%;height:100%;background:#07182b;color:#fff;font-family:sans-serif}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}h1{font-size:88px;font-weight:500;margin:0 0 28px}p{font-size:32px;color:#78c8ff}</style></head>
<body><main><h1>TizPSX</h1><p id="status">Opening…</p></main><script>
(function(){var APP='org.pablo.tizpsx',status=document.getElementById('status'),launched=false,wasHidden=false,timer;
function leave(){try{tizen.application.getCurrentApplication().exit();}catch(e){}}
function fail(e){launched=false;status.textContent='Could not launch: '+e.message+' — press Enter to retry';}
function launch(){status.textContent='Opening…';clearTimeout(timer);try{tizen.application.launch(APP,function(){launched=true;timer=setTimeout(function(){if(!document.hidden)status.textContent='Still starting… Enter retries, Back exits';},20000);},fail);}catch(e){fail(e);}}
document.addEventListener('visibilitychange',function(){if(!launched)return;if(document.hidden){wasHidden=true;leave();}else if(wasHidden)leave();});
document.addEventListener('keydown',function(e){if(e.keyCode===13)launch();else if(e.keyCode===10009)leave();});launch();}());
</script></body></html>
